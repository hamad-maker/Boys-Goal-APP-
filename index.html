<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goals Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Home Screen -->
    <div id="app">
        <div id="home-screen" class="screen active">
            <div class="screen-header">
                <h1 class="screen-title">My Goals</h1>
                <p class="screen-subtitle" id="home-subtitle">Keep pushing forward</p>
            </div>
            <div id="goals-grid" class="goals-grid">
                <!-- Goal cards rendered here -->
            </div>
            <button class="fab" id="add-goal-btn" aria-label="Add new goal">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
        </div>

        <!-- Create/Edit Goal Screen -->
        <div id="create-screen" class="screen">
            <div class="screen-header">
                <button class="back-btn" id="create-back-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                    Back
                </button>
                <h1 class="screen-title" id="create-title">New Goal</h1>
            </div>
            <form id="goal-form" class="form-container">
                <div class="form-group">
                    <label for="goal-name">Goal Name</label>
                    <input type="text" id="goal-name" placeholder="e.g., Save for a car" required>
                </div>
                <div class="form-group">
                    <label>Goal Type</label>
                    <div class="type-selector">
                        <button type="button" class="type-btn active" data-type="financial">
                            <span class="type-icon">PKR</span>
                            <span class="type-label">Financial</span>
                        </button>
                        <button type="button" class="type-btn" data-type="count">
                            <span class="type-icon">#</span>
                            <span class="type-label">Count</span>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="goal-target" id="target-label">Target Amount (PKR)</label>
                    <input type="number" id="goal-target" placeholder="e.g., 4000000" required min="1">
                </div>
                <div class="form-group">
                    <label for="goal-icon">Icon</label>
                    <div class="icon-picker" id="icon-picker">
                        <button type="button" class="icon-btn active" data-icon="star">&#9733;</button>
                        <button type="button" class="icon-btn" data-icon="money">&#128176;</button>
                        <button type="button" class="icon-btn" data-icon="target">&#127919;</button>
                        <button type="button" class="icon-btn" data-icon="trophy">&#127942;</button>
                        <button type="button" class="icon-btn" data-icon="rocket">&#128640;</button>
                        <button type="button" class="icon-btn" data-icon="heart">&#10084;</button>
                        <button type="button" class="icon-btn" data-icon="fire">&#128293;</button>
                        <button type="button" class="icon-btn" data-icon="gem">&#128142;</button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="goal-color">Color</label>
                    <div class="color-picker" id="color-picker">
                        <button type="button" class="color-btn active" data-color="#007AFF" style="background:#007AFF"></button>
                        <button type="button" class="color-btn" data-color="#34C759" style="background:#34C759"></button>
                        <button type="button" class="color-btn" data-color="#FF9500" style="background:#FF9500"></button>
                        <button type="button" class="color-btn" data-color="#FF3B30" style="background:#FF3B30"></button>
                        <button type="button" class="color-btn" data-color="#AF52DE" style="background:#AF52DE"></button>
                        <button type="button" class="color-btn" data-color="#FF2D55" style="background:#FF2D55"></button>
                        <button type="button" class="color-btn" data-color="#5856D6" style="background:#5856D6"></button>
                        <button type="button" class="color-btn" data-color="#00C7BE" style="background:#00C7BE"></button>
                    </div>
                </div>
                <button type="submit" class="primary-btn" id="save-goal-btn">Create Goal</button>
                <button type="button" class="danger-btn hidden" id="delete-goal-btn">Delete Goal</button>
            </form>
        </div>

        <!-- Goal Detail Screen -->
        <div id="detail-screen" class="screen">
            <div class="screen-header">
                <button class="back-btn" id="detail-back-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                    Goals
                </button>
                <button class="edit-btn" id="edit-goal-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                    </svg>
                </button>
            </div>
            <div class="detail-content">
                <div class="detail-hero" id="detail-hero">
                    <div class="detail-icon" id="detail-icon"></div>
                    <h2 class="detail-title" id="detail-title"></h2>
                    <div class="detail-progress-ring" id="detail-progress-ring">
                        <svg viewBox="0 0 120 120">
                            <circle class="progress-bg" cx="60" cy="60" r="52" />
                            <circle class="progress-fill" cx="60" cy="60" r="52" id="progress-circle" />
                        </svg>
                        <div class="progress-text" id="progress-text">0%</div>
                    </div>
                    <div class="detail-stats">
                        <div class="stat">
                            <span class="stat-value" id="stat-achieved">0</span>
                            <span class="stat-label">Achieved</span>
                        </div>
                        <div class="stat-divider"></div>
                        <div class="stat">
                            <span class="stat-value" id="stat-remaining">0</span>
                            <span class="stat-label">Remaining</span>
                        </div>
                        <div class="stat-divider"></div>
                        <div class="stat">
                            <span class="stat-value" id="stat-entries">0</span>
                            <span class="stat-label">Entries</span>
                        </div>
                    </div>
                </div>

                <!-- Add Entry Section -->
                <div class="add-entry-section" id="add-entry-section">
                    <div class="entry-input-row">
                        <input type="number" id="entry-amount" class="entry-input" placeholder="Enter amount" min="1">
                        <button class="add-entry-btn" id="add-entry-btn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                            Add
                        </button>
                    </div>
                    <input type="text" id="entry-note" class="entry-note-input" placeholder="Add a note (optional)">
                </div>

                <!-- Entries List -->
                <div class="entries-section">
                    <h3 class="section-title">History</h3>
                    <div id="entries-list" class="entries-list">
                        <!-- Entries rendered here -->
                    </div>
                    <div id="empty-entries" class="empty-state">
                        <p>No entries yet</p>
                        <p class="empty-hint">Add your first entry above to start tracking</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Celebration Canvas -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
</body>
</html>
